version: "2"

run:
  timeout: 5m
  concurrency: 4
  issues-exit-code: 1
  tests: true
  build-tags:
    - integration
  modules-download-mode: readonly
  allow-parallel-runners: true

output:
  sort-order:
    - linter
    - severity
    - file
  show-stats: false
  path-prefix: ""

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
    - gci
    - golines
  settings:
    gofumpt:
      extra:
        group-params: true
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/semiplane)
    golines:
      max-len: 100
      tab-len: 4
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

linters:
  default: standard
  enable:
    # --- correctness ---
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - gosec
    - govet
    - ineffassign
    - makezero
    - mirror
    - nilerr
    - noctx
    - perfsprint
    - predeclared
    - reassign
    - recvcheck
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck

    # --- API & maintainability ---
    - containedctx
    - decorder
    - dupword
    - funcorder
    - goconst
    - godot
    - godoclint
    - godox
    - gomoddirectives
    - iface
    - importas
    - inamedparam
    - interfacebloat
    - loggercheck
    - misspell
    - modernize
    - musttag
    - nakedret
    - nilnil
    - nolintlint
    - prealloc
    - protogetter
    - sloglint
    - tagalign
    - tagliatelle
    - testpackage
    - thelper
    - varnamelen
    - wsl_v5

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1020
        - -ST1021
        - -ST1022
    errcheck:
      check-type-assertions: true
      check-blank: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      # S-10.4: rule code may not reach for a wall clock or for ambient
      # randomness. These patterns are NOT hand-maintained -- they are
      # `determinism.LintPatterns()`, derived from the same table `Audit` walks,
      # and `TestTheLintConfigurationIsTheTableTheAuditWalks` fails the build if
      # this list and that function disagree. Editing one without the other is
      # the drift this comment exists to make impossible.
      #
      # Configuring `forbid` here also replaces forbidigo's default list
      # (`fmt.Print*` and the bare `print`/`println`), which nothing in this
      # repository calls, and which `TestTheLintConfigurationIsTheTableTheAuditWalks`
      # confirms is gone. `TestTheSeededDerivationIsNotFlagged` is the other half
      # of that: `rand.New` and `rand.NewPCG` are how `rules.Context.Rand` derives
      # a source from a campaign's recorded seed, and they are deliberately absent
      # from the `rand` alternation. A determinism rule that fires on the one
      # correct implementation of randomness is a rule nobody disables.
      #
      # The scope is not here because forbidigo has no path setting; it is the
      # `path-except` rule under `exclusions` below, which keeps every one of
      # these findings out of the rest of the codebase.
      forbid:
        # `time`'s clock: a value, or the passage of one, a result can depend on.
        - pattern: '^time\.(After|AfterFunc|NewTicker|NewTimer|Now|Since|Sleep|Tick|Until)$'
          msg: 'S-10.4: a resolution is a pure function of (state, intent, seed); rules.Context.Rand derives randomness from the seed and there is no clock. See ADR 0044.'
        # The package-level source of crypto/rand, math/rand and math/rand/v2.
        # All three name their package `rand`, which is why this is one pattern
        # and why it has to be derived rather than written out per import path.
        # `rand.New`, `rand.NewPCG` and `rand.NewChaCha8` are absent on purpose.
        - pattern: '^rand\.(ExpFloat64|Float32|Float64|Int|Int31|Int31n|Int32N|Int63|Int63n|Int64N|IntN|Intn|N|NormFloat64|Perm|Prime|Read|Seed|Shuffle|Text|Uint32|Uint32N|Uint64|Uint64N)$'
          msg: 'S-10.4: the package-level source is seeded per process, so a roll from it is not auditable and a replay does not replay it. Use rules.Context.Rand(label). See ADR 0044.'
      # There is deliberately NO pattern for map iteration. One was written --
      # `^maps\.(All|Keys|Values)$` -- and removed, because forbidigo sees the
      # call and not what the call is an argument to: `slices.Sorted(maps.Keys(m))`,
      # the one sanctioned spelling, was flagged exactly as loudly as
      # `for k := range maps.Keys(m)`. A determinism rule that fires on the one
      # correct way to write the thing it forbids is a rule the next contributor
      # disables wholesale, and a disabled rule catches nothing. This is the same
      # failure `Context.Rand`'s G404 suppression exists to avoid, in the linter's
      # own configuration.
      #
      # So map iteration belongs to the audit (`range/map` and
      # `range/map-iterator`, the two entries in `determinism.LintBlindSpots`, held
      # by `TestNoRuleFileBreaksTheDeterminismRules`), which reads the range
      # clause rather than the call and can therefore tell the two apart. The
      # linter keeps the half it can hold; the audit keeps the half it can.
    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G104
        - G304
      config:
        G401:
          - "crypto/md5"
          - "crypto/sha1"
        G115:
          - "max=2147483647"
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - ifElseChain
        - hugeParam
        - unnamedResult
    revive:
      confidence: 0.8
      enable-default-rules: true
      rules:
        - name: context-as-argument
          disabled: true
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: empty-block
        - name: unreachable-code
        - name: redefines-builtin-id
    goconst:
      min-len: 3
      min-occurrences: 3
      ignore-tests: true
    misspell:
      locale: UK
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    varnamelen:
      min-name-length: 3
      ignore-names:
        - err
        - ctx
        - tx
        - db
        - id
        - ok
        - r
        - w
      ignore-decls:
        - "t *testing.T"
        - "b *testing.B"
        - "f *testing.F"
    godot:
      scope: declarations
      capital: false
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
      ignore-package-globs:
        - "encoding/*"
        - "github.com/pkg/errors"

  exclusions:
    generated: lax
    warn-unused: false
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      # forbidigo's scope, in one place. The patterns above are the whole of
      # S-10.4's call half and they apply *only* to rule code: `internal/domain`
      # keeps a `time.Now` in its store's clock, its middleware times requests,
      # and its tests need a wall clock. `path-except` rather than `path` because
      # forbidigo has no path setting of its own.
      #
      # The expression is `determinism.ScopePattern()`, derived from
      # `determinism.RuleDirs()`, and `TestTheLintScopeIsTheAuditScope` fails the
      # build when the two disagree: an audit watching directories the linter does
      # not is the one drift that loses a violation rather than duplicating one.
      #
      # `internal/domain/systems` is named before it exists, so the second half of
      # the phase is covered the moment it lands and a new rule package cannot be
      # added without this file noticing.
      - path-except: '^(internal/domain/rules/|internal/domain/systems/)'
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - goconst
          - wsl_v5
          - varnamelen
          - godot
          - funcorder
      - path: (^|/)migrations?/
        linters:
          - gosec
          - goconst
          - errcheck
      - path: (.+)_test\.go
        text: 't\.Helper\(\)'
    paths:
      - third_party$
      - builtin$
      - examples$
      - '\.pb\.go$'
      - '_gen\.go$'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
  new: false
  fix: false
  whole-files: false

severity:
  default: error
