openapi: 3.1.0
info:
  title: Semiplane API
  version: 0.0.0-slice
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: liveness
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/version:
    get:
      operationId: version
      responses:
        '200':
          description: build version
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
  # Phase-1 surface, served by internal/api (plan Phase 1/E). All errors are
  # RFC 7807 application/problem+json (tech-stack §6) via the single
  # error path; success bodies are application/json unless noted.
  /api/v1/notes:
    get:
      operationId: listNotes
      summary: list notes under a vault prefix
      description: >-
        Lists vault-relative .md paths in lexical order. ?folder= (alias
        ?prefix=) scopes to a vault subtree, e.g. ?folder=campaign. Tag/type
        filtering is future work and intentionally absent from this version.
        Each entry carries its display title (first ATX heading, basename
        fallback per index.ParseTitle).
      parameters:
        - {name: folder, in: query, schema: {type: string}}
        - {name: prefix, in: query, schema: {type: string}}
      responses:
        '200':
          description: note list
          content:
            application/json:
              schema:
                type: object
                required: [notes]
                properties:
                  notes:
                    type: array
                    items:
                      type: object
                      required: [path, title]
                      properties:
                        path: {type: string, example: campaign/intro.md}
                        title: {type: string, example: Intro}
  /api/v1/notes/{path}:
    get:
      operationId: getNote
      summary: note document (fragment + meta + backlinks + ETag)
      description: >-
        Returns the stream-F wire shape: content (raw Markdown, frontmatter
        included, for the editor), fragment (role-rendered HTML for the
        reader), meta (frontmatter mapping; known keys documented in the
        render.META_KEYS registry comment), backlinks (vault-relative .md
        paths linking here), and etag (hex content hash, also sent as the
        ETag response header). ?role=player (default) strips :::gm
        server-side; ?role=gm keeps secrets. Conditional reads: If-None-Match
        (quoted, weak, bare, list, or *) yields 304 when the hash matches.
      parameters:
        - {name: path, in: path, required: true, schema: {type: string}}
        - {name: role, in: query, schema: {type: string, enum: [player, gm]}}
      responses:
        '200':
          description: note document
          content:
            application/json:
              schema:
                type: object
                required: [path, content, fragment, meta, backlinks, etag]
                properties:
                  path: {type: string}
                  content: {type: string}
                  fragment: {type: string}
                  meta: {type: object}
                  backlinks: {type: array, items: {type: string}}
                  etag: {type: string}
        '304':
          description: not modified (If-None-Match hit)
        '400':
          description: bad role
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
        '404':
          description: unknown path
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
    post:
      operationId: postNote
      summary: atomic upsert with explicit create/update branch
      description: >-
        Body is {content, hash}. The hash field branches explicitly (decided
        ruling, plan Phase 1/E): an EMPTY hash means CREATE — no
        precondition, 201 on success, 409 when the path already exists (never
        silent overwrite). A NON-EMPTY hash means UPDATE guarded by the
        read-time hash — 200 on success, 409 on concurrent external edit
        (re-read, merge, retry; tech-stack §5). Writes are atomic
        (temp → fsync → rename) and reindex the derived FTS5/backlink rows
        best-effort. ?role= selects the returned fragment, as in GET.
      parameters:
        - {name: path, in: path, required: true, schema: {type: string}}
        - {name: role, in: query, schema: {type: string, enum: [player, gm]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: {type: string}
                hash: {type: string, description: empty means create, non-empty means update-or-409}
      responses:
        '200':
          description: updated note (same shape as GET)
          content:
            application/json:
              schema:
                type: object
                required: [path, content, fragment, meta, backlinks, etag]
                properties:
                  path: {type: string}
                  content: {type: string}
                  fragment: {type: string}
                  meta: {type: object}
                  backlinks: {type: array, items: {type: string}}
                  etag: {type: string}
        '201':
          description: created note (same shape as GET)
          content:
            application/json:
              schema:
                type: object
        '409':
          description: create-on-existing or stale-hash update
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
  /api/v1/search:
    get:
      operationId: search
      summary: FTS5 BM25-ranked search over the corpus
      description: >-
        Runs the derived SQLite FTS5 index (BM25 rank, snippet highlights).
        ?q= is required (400 otherwise). ?limit= clamps to 1..50 (default
        10). MATCH syntax errors retry once as a quoted phrase before
        failing. Scores are negated BM25 (higher is better).
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer}}
      responses:
        '200':
          description: ranked hits
          content:
            application/json:
              schema:
                type: object
                required: [hits]
                properties:
                  hits:
                    type: array
                    items:
                      type: object
                      required: [path, snippet, score]
                      properties:
                        path: {type: string}
                        snippet: {type: string}
                        score: {type: number}
        '400':
          description: missing q or bad limit
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
  /api/v1/graph:
    get:
      operationId: graph
      summary: nodes/edges for link visualisation
      description: >-
        Every indexed note as a node (path + title) plus every stored
        wikilink edge (src → dst), both lexical. Edges may dangle (target
        with no note row) until the target is created; the vault filesystem
        is the source of truth.
      responses:
        '200':
          description: link graph
          content:
            application/json:
              schema:
                type: object
                required: [nodes, edges]
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      required: [path, title]
                      properties:
                        path: {type: string}
                        title: {type: string}
                  edges:
                    type: array
                    items:
                      type: object
                      required: [src, dst]
                      properties:
                        src: {type: string}
                        dst: {type: string}
  /api/v1/dice/roll:
    post:
      operationId: rollDice
      summary: server-authoritative roll with seeded replay and tier breakdown
      description: >-
        Resolves one dice formula with the same engine that later serves
        /ws/vtt (tech-stack §3.8) and journals the v0 replay fields
        (seed, faces, contributions, conditions, pack, ontology version) to
        the oplog, broadcasting dice_rolled on SSE. Seeding is decided:
        SEMIPLANE_TEST_SEED wins when set and parseable (deterministic E2E +
        exact goldens); otherwise the request seed wins when non-zero;
        otherwise the server draws crypto-random. ?breakdown=1 adds the
        GM-toggle lines: kept/discarded faces plus per-tier dice/flat lines,
        so not-doubled-on-crit stays auditable.
      parameters:
        - {name: breakdown, in: query, schema: {type: string, enum: ['1']}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [formula]
              properties:
                formula: {type: string, example: 2d20kh1+5}
                seed: {type: integer, description: advisory; ignored when SEMIPLANE_TEST_SEED is set}
      responses:
        '200':
          description: roll trace
          content:
            application/json:
              schema:
                type: object
                required: [formula, total, faces, seed]
                properties:
                  formula: {type: string}
                  total: {type: integer}
                  faces: {type: array, items: {type: integer}}
                  seed: {type: integer}
                  kept: {type: array, items: {type: integer}}
                  discarded: {type: array, items: {type: integer}}
                  breakdown: {type: array, items: {type: string}}
        '400':
          description: missing formula or invalid dice expression
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
  /api/v1/reveal:
    post:
      operationId: reveal
      summary: reveal a GM block, broadcast via SSE block_revealed
      description: >-
        Body is {page, blockId}. The page must exist (404 otherwise); its
        GM fragment is pre-rendered server-side and broadcast as a
        block_revealed SSE event {page, blockId, html} (tech-stack §3.2:
        never trust-the-client). v0 broadcasts the page GM fragment with
        the block id; per-block HTML slicing is a later slice. Returns the
        published SSE event id for Last-Event-ID resumption.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [page, blockId]
              properties:
                page: {type: string}
                blockId: {type: string}
      responses:
        '200':
          description: reveal broadcast accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok, eventId]
                properties:
                  ok: {type: boolean}
                  eventId: {type: integer}
        '400':
          description: missing page or blockId
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
        '404':
          description: unknown page
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
  /api/v1/events:
    get:
      operationId: events
      summary: SSE stream with Last-Event-ID replay
      description: >-
        text/event-stream broadcast (tech-stack §3.5, §7): dice_rolled,
        block_revealed, and future low-frequency frames. The Last-Event-ID
        header (or ?lastEventId= fallback; header wins, unparsable values
        replay from 0) replays every kept event after that id, so a client
        that slept through a roll sees it on reconnect. Event ids are
        server-assigned monotonic sequence numbers.
      parameters:
        - {name: lastEventId, in: query, schema: {type: integer}}
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
  # Phase 1/C auth surface. All errors are RFC 7807 application/problem+json.
  # Session cookie: `semiplane_session` (HttpOnly, SameSite=Lax, Secure per
  # X-Forwarded-Proto or --force-secure). Login / lan / join set it; logout
  # clears it. Bearer tokens are also accepted (acl.RequireSession). When OIDC
  # is unset (issuer/ client id/secret/redirect URL all absent) the two oidc
  # routes answer 503 problem+json instead of panicking.
  /api/v1/auth/login:
    post:
      operationId: login
      summary: password login, sets the session cookie
      description: >-
        Body is {username, password}. On success mints a session and sets the
        `semiplane_session` cookie (HttpOnly, SameSite=Lax, Secure per
        X-Forwarded-Proto / --force-secure) and returns {user_id, role}.
        Unknown user and wrong password are deliberately identical 401s.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string}
      responses:
        '200':
          description: session minted, cookie set
          content:
            application/json:
              schema:
                type: object
                required: [user_id, role]
                properties:
                  user_id: {type: string}
                  role: {type: string, enum: [gm, player]}
        '400':
          description: malformed or oversized body
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
        '401':
          description: invalid username or password
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
        '429':
          description: rate limited
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: revoke the session and clear the cookie
      description: >-
        Revokes the presented session (cookie or bearer token) and always
        clears the `semiplane_session` cookie. Idempotent: 204 even when no
        valid session exists. Never leaks whether a cookie was alive.
      responses:
        '204':
          description: logged out, cookie cleared
        '401':
          description: no valid session (still clears cookie, still 204)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
        '429':
          description: rate limited
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
  /api/v1/auth/me:
    get:
      operationId: me
      summary: identity of the session cookie holder
      description: >-
        Returns {user_id, role} for the bearer token or session cookie bearer.
        Requires authentication (acl.RequireSession); missing or invalid
        session is 401 problem+json.
      responses:
        '200':
          description: current identity
          content:
            application/json:
              schema:
                type: object
                required: [user_id, role]
                properties:
                  user_id: {type: string}
                  role: {type: string, enum: [gm, player]}
        '401':
          description: authentication required
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
        '429':
          description: rate limited
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
  /api/v1/auth/lan:
    post:
      operationId: lanCreate
      summary: mint a 6-digit LAN join code (GM only)
      description: >-
        GM session required; players receive 403, anonymous 401. Mints a
        single-use 6-digit code (10-minute TTL) and returns {code}. Requires
        authentication.
      responses:
        '200':
          description: code minted
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: {type: string, example: "123456"}
        '401':
          description: authentication required
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
        '403':
          description: gm role required
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
        '429':
          description: rate limited
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
        '503':
          description: lan codes not configured
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
  /api/v1/auth/lan/join:
    post:
      operationId: lanJoin
      summary: consume a 6-digit LAN code and start a session
      description: >-
        Unauthenticated by design (the code is the credential). Body is
        {code}. Per-IP rate limited: wrong AND right codes both return 429
        over the limit so brute force gains nothing. On success mints a
        session and sets the `semiplane_session` cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, example: "123456"}
      responses:
        '200':
          description: session minted, cookie set
          content:
            application/json:
              schema:
                type: object
                required: [user_id, role]
                properties:
                  user_id: {type: string}
                  role: {type: string, enum: [gm, player]}
        '400':
          description: malformed body
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
        '401':
          description: code invalid, expired, or already used
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
        '429':
          description: rate limited (wrong or right code alike)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
        '503':
          description: lan codes not configured
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
  /api/v1/auth/oidc/start:
    get:
      operationId: oidcStart
      summary: begin OIDC Authorization Code + PKCE flow
      description: >-
        Redirects to the OIDC provider's authorization endpoint with state,
        S256 code_challenge, and nonce. 503 problem+json ("oidc not
        configured") when no provider is wired (issuer/client id/secret/redirect
        URL unset) — never a panic.
      responses:
        '302':
          description: redirect to provider authorization endpoint
        '429':
          description: rate limited
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
        '503':
          description: oidc not configured
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
  /api/v1/auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: complete OIDC Authorization Code + PKCE flow
      description: >-
        Consumes state, exchanges the code, verifies the ID token + nonce,
        upserts the mapped local user (role "player"), mints a session, sets
        the cookie, and redirects to "/". Provider errors and identity
        failures are 401. 503 problem+json when OIDC is not configured.
      parameters:
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code, in: query, required: true, schema: {type: string}}
      responses:
        '302':
          description: redirect to "/" after successful login
        '401':
          description: oidc login failed
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
        '429':
          description: rate limited
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
        '502':
          description: provider exchange failed
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
        '503':
          description: oidc not configured
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/problem'}
components:
  schemas:
    problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, example: about:blank}
        title: {type: string, example: not found}
        status: {type: integer, example: 404}
        detail: {type: string}
