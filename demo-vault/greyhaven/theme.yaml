# theme.yaml — Greyhaven's brand.
#
# Read by exactly one route: `GET /c/{slug}/theme.css`. It is not a stylesheet and
# cannot become one; the server validates this file and *generates* the sheet, and
# the shell links the generated address in every page of the campaign.
#
# See `notes/theme.md` in this vault for why the vocabulary below is the whole of it.
#
# The file is attacker-reachable — a shared vault arrives by sync client as often as
# by hand — so it is validated against a closed vocabulary rather than filtered. Two
# properties worth knowing as an author:
#
#   * **The vocabulary is closed.** These three names are all a campaign may set.
#     Everything else — the text and border colours, the focus ring, the callout
#     surfaces, the type and space scales, the minimum target size, `--font-mono` —
#     is semiplane's, and the generator iterates the names it will emit rather than
#     checking a list of names to refuse. There is no spelling of `--focus-ring`
#     this route will pass through.
#
#   * **The brand pair is both-or-neither, and it is measured twice.** `--brand-accent`
#     must clear 4.5:1 against `--brand-accent-ink` (text on the accent) and 3:1
#     against `--bg` on the **light page and the dark page**. The dark-page half is
#     the one people forget, and it is why a mid-tone accent that looks fine in a
#     light theme gets refused.
#
# Measured for the pair below:
#
#     against #ffffff  (the ink)  4.85    floor 4.5
#     against #f7f6f3  (light)    4.48    floor 3
#     against #14181d  (dark)     3.68    floor 3
#
# Only `#rgb` and `#rrggbb` are accepted. A floor cannot be evaluated against
# `var(--x)` or the word `navy`, so a value the validator cannot compute is a
# refusal with a reason rather than a floor it declines to check.
#
# A `#rrggbb` value is a six-character grammar and the constraint is deliberate: it is
# small enough that a reader can compute the contrast by hand before they commit to it.
#
# Refused content is not fatal — the campaign keeps the last sheet that passed and one
# error-level line is logged, so a typo costs a colour and not a campaign. An
# *unreadable* file is a different answer: 500, because "no theme" would be a lie
# served to every reader of the campaign.

tokens:
  --brand-accent: "#55796b"
  --brand-accent-ink: "#ffffff"