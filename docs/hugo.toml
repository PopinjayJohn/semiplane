# semiplane documentation site.
#
# `docs/` is a self-contained Hugo project root: run `hugo` from inside it with
# no flags, or use the Makefile (`make site`, `make site-check`, `make
# site-serve`) which is the only place that knows where this directory lives.
#
# baseURL is supplied on the command line by the deploy job. The value here is
# only the local-preview fallback.

baseURL = "https://popinjayjohn.github.io/semiplane/"

# English only, but shaped for more. Content lives under content/en/ and the
# base language carries no /en/ prefix, so adding a language later is a config
# change plus a content/de/ tree -- not a move of every existing file and link.
#
# Two keys here are load-bearing and neither is obvious:
#
#   * The [languages] block must be explicit. With only defaultContentLanguage
#     set, Hugo detects "en" from the directory name and still publishes the
#     default language under /en/, which silently puts every URL behind a prefix.
#   * contentDir must be declared per language. Left to auto-detection, Hugo
#     publishes every page under /en/ regardless of
#     defaultContentLanguageInSubdir = false. The setting is honoured, but the
#     output is duplicated at both / and /en/ with different canonical URLs, so
#     the site is served twice and search engines pick one at random.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# No theme. A third-party theme is a supply-chain dependency on the security
# documentation of a project with a threat model, and it would not match the
# token layer the application uses anyway.
theme = []

# Nothing on this site is tagged or categorised, and the empty taxonomy pages
# Hugo would generate by default are 404 bait with a sitemap entry each.
disableKinds = ["taxonomy", "term"]

# Two commits do not make a meaningful Lastmod, and a Lastmod that changes on
# every commit is worse than none for a site whose pages change rarely.
enableGitInfo = false
enableRobotsTXT = true

# Every key below this line belongs to a table, so the top-level keys all have to
# come first. A top-level key placed after [languages] is silently read as
# languages.<key> -- which is how enableGitInfo once ended up nested and
# defaultContentLanguageInSubdir was ignored, publishing every page under /en/.
[languages]
  [languages.en]
    label = "English"
    locale = "en-GB"
    weight = 1
    contentDir = "content/en"
    title = "semiplane"
    [languages.en.params]
      description = "A self-hosted, system-agnostic TTRPG wiki and virtual tabletop. One Go binary, one SQLite file, your campaign content in your own Obsidian vault."

# Hugo sandboxes os.ReadFile to the project root: neither "../.kilo/plans/..." nor
# an absolute path outside docs/ resolves, and a path that escapes the root
# returns empty rather than an error -- which is exactly the silent-empty-page
# failure the design-record shortcode exists to prevent. A module mount would be
# the tidy way in, but declaring [module] mounts makes this Hugo build publish
# every page under /en/ regardless of defaultContentLanguageInSubdir, so the
# records are copied into docs/assets/plans/ by `make site-plans` instead, which
# every site target depends on. Run hugo through the Makefile rather than
# directly, or the copy may be stale.
[params]
  # The design-record shortcode resolves its target through this, so a renamed
  # plan fails one edit here and one rg -- not a hard-coded path in a layout.
  # Resolved as an asset path, because Hugo mounts ../.kilo/plans to assets/plans.
  planDir = "plans"
  repo = "https://github.com/PopinjayJohn/semiplane"
  # Dated in the banner on every /design/ page. These are records, not docs.
  designRecordDate = "2026-09-30"
  # Single source for the primary nav, the home page's card grid, and the
  # "is this the current page" check. A new section appears in all three by
  # being added here once.
  #
  # Paths are relative, with no leading slash. relURL adds the baseURL path, so
  # "/install/" would resolve to the server root and 404 on a project site
  # served from https://popinjayjohn.github.io/semiplane/, while "install/"
  # resolves correctly from every page including the home page.
  nav = [
    { name = "Install", url = "install/" },
    { name = "Concepts", url = "concepts/" },
    { name = "Operating", url = "operating/" },
    { name = "Roadmap", url = "roadmap/" },
    { name = "Contributing", url = "contributing/" },
    { name = "Design records", url = "design/" },
  ]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Campaign content is rendered with html.WithUnsafe() never enabled, and
      # the docs site holds itself to the same rule: no raw HTML from content.
      unsafe = false
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    # The plans carry ```mermaid blocks. Without a renderer they degrade to
    # readable code, which is an acceptable state for a record page. A CDN
    # <script> to draw them is not: see layouts/index.html.
    noClasses = false
    lineNos = false
    tabWidth = 2

[outputs]
  home = ["html", "rss"]
  section = ["html"]
