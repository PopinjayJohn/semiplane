{{- define "main" -}}
<article class="page">
  <h1>{{ .Title }}</h1>
  {{- with .Description }}
    <p class="lede">{{ . }}</p>
  {{- end }}
  {{- with .Params.banner }}
    <aside class="banner" data-testid="page-banner">
      <p>{{ . | markdownify }}</p>
    </aside>
  {{- end }}
  {{- if and .TableOfContents (gt (len .TableOfContents) 60) }}
    <details class="toc" data-testid="toc">
      <summary>On this page</summary>
      {{ .TableOfContents }}
    </details>
  {{- end }}
  {{ .Content }}
</article>
{{- end -}}
