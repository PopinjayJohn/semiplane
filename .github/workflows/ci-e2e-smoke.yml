name: ci-e2e-smoke

# Advisory early warning (NOT a required check): smoke E2E on PRs touching the
# web surface, so breakage shows on the feature branch instead of at PR-to-main.
# Separate workflow because `paths` filters are trigger-level (docs/ci.md).
on:
  pull_request:
    paths: ['e2e/**', 'web/**', 'testdata/**']

concurrency:
  group: smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27', cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - run: make build
      - run: make e2e project=smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-smoke-artifacts, path: e2e/test-results, retention-days: 14 }
