blank_issues_enabled: false
contact_links:
  - name: My campaign's content is not rendering
    url: https://github.com/PopinjayJohn/semiplane/discussions/new
    about: >-
      Campaign content lives in your own Obsidian vault, not in this repository, so a page
      that renders wrongly is usually a content or vault problem rather than a semiplane
      bug. Ask here with your front matter and the markdown that misbehaves.
  - name: Security report
    url: https://github.com/PopinjayJohn/semiplane/security/advisories/new
    about: >-
      Report a vulnerability privately. Please do not open a public issue for one — see the
      security policy for what counts and what is by-design.
